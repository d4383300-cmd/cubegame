<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Кубик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #121212;
      --bg-panel: #1a1a1a;
      --border: #262626;
      --text-main: #f5f5f5;
      --text-muted: #737373;
      --accent: #ffffff;
      --win: #22c55e;
      --lose: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #050505;
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Строгий вертикальный контейнер */
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-main);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    /* Верхняя панель */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 10;
    }

    .header.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .balance-box {
      display: flex;
      flex-direction: column;
    }

    .balance-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .bonus-btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .bonus-btn:active {
      background: #2a2a2a;
    }

    /* Центральная сцена с 3D-кубиком */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 900px;
    }

    .cube-wrapper {
      width: 110px;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), scale 0.8s ease;
    }

    .cube-wrapper.intro-spin {
      animation: introRotate 5s infinite linear;
    }

    .cube-wrapper.shrunk {
      scale: 0.88;
    }

    .cube-wrapper.reveal-pop {
      animation: popScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes introRotate {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg); }
      100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(360deg); }
    }

    @keyframes popScale {
      0% { scale: 0.5; opacity: 0; }
      70% { scale: 1.15; opacity: 1; }
      100% { scale: 1; opacity: 1; }
    }

    .face {
      position: absolute;
      width: 110px;
      height: 110px;
      background: #ececec;
      border: 2px solid #cccccc;
      border-radius: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 14px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
      backface-visibility: hidden;
    }

    .pip {
      width: 16px;
      height: 16px;
      background: #111111;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    .face-1 .pip { background: #d92d20; width: 22px; height: 22px; }

    /* Позиции граней 3D-куба */
    .face-1 { transform: rotateY(0deg) translateZ(55px); }
    .face-6 { transform: rotateY(180deg) translateZ(55px); }
    .face-2 { transform: rotateY(-90deg) translateZ(55px); }
    .face-5 { transform: rotateY(90deg) translateZ(55px); }
    .face-3 { transform: rotateX(90deg) translateZ(55px); }
    .face-4 { transform: rotateX(-90deg) translateZ(55px); }

    /* Оверлей для 10-секундного видео */
    .video-container {
      position: absolute;
      inset: 0;
      background: #000000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-container.active {
      display: flex;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Уведомление об исходе */
    .result-banner {
      margin-top: 28px;
      min-height: 28px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .result-banner.visible { opacity: 1; }
    .result-banner.win { color: var(--win); }
    .result-banner.lose { color: var(--lose); }

    /* Нижнее меню ставок */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 10;
    }

    .controls.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .bet-input-row {
      display: flex;
      gap: 8px;
    }

    .bet-input {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    .bet-input:focus {
      border-color: #525252;
    }

    .quick-bets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .quick-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-btn:active { background: #262626; }

    .outcomes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .outcome-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .outcome-btn span.coef {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .outcome-btn.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    .outcome-btn.active span.coef {
      color: #404040;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #000000;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Верхняя панель -->
    <div class="header" id="header">
      <div class="balance-box">
        <span class="balance-label">Ваш баланс</span>
        <span class="balance-value"><span id="balance">0</span> ₽</span>
      </div>
      <button class="bonus-btn" id="bonusBtn">Бонус +25 ₽</button>
    </div>

    <!-- Центральная зона: Кубик и Видео -->
    <div class="stage">
      <div class="cube-wrapper intro-spin" id="cube">
        <!-- Грань 1 -->
        <div class="face face-1">
          <div class="pip" style="grid-area: 2 / 2;"></div>
        </div>
        <!-- Грань 2 -->
        <div class="face face-2">
          <div class="pip" style="grid-area: 1 / 1;"></div>
          <div class="pip" style="grid-area: 3 / 3;"></div>
        </div>
        <!-- Грань 3 -->
        <div class="face face-3">
          <div class="pip" style="grid-area: 1 / 1;"></div>
          <div class="pip" style="grid-area: 2 / 2;"></div>
          <div class="pip" style="grid-area: 3 / 3;"></div>
        </div>
        <!-- Грань 4 -->
        <div class="face face-4">
          <div class="pip" style="grid-area: 1 / 1;"></div>
          <div class="pip" style="grid-area: 1 / 3;"></div>
          <div class="pip" style="grid-area: 3 / 1;"></div>
          <div class="pip" style="grid-area: 3 / 3;"></div>
        </div>
        <!-- Грань 5 -->
        <div class="face face-5">
          <div class="pip" style="grid-area: 1 / 1;"></div>
          <div class="pip" style="grid-area: 1 / 3;"></div>
          <div class="pip" style="grid-area: 2 / 2;"></div>
          <div class="pip" style="grid-area: 3 / 1;"></div>
          <div class="pip" style="grid-area: 3 / 3;"></div>
        </div>
        <!-- Грань 6 -->
        <div class="face face-6">
          <div class="pip" style="grid-area: 1 / 1;"></div>
          <div class="pip" style="grid-area: 1 / 3;"></div>
          <div class="pip" style="grid-area: 2 / 1;"></div>
          <div class="pip" style="grid-area: 2 / 3;"></div>
          <div class="pip" style="grid-area: 3 / 1;"></div>
          <div class="pip" style="grid-area: 3 / 3;"></div>
        </div>
      </div>

      <div class="result-banner" id="resultBanner">Выберите исход и сделайте ставку</div>

      <!-- Видеоролик броска -->
      <div class="video-container" id="videoOverlay">
        <video id="rollVideo" src="/video.mp4" playsinline preload="auto"></video>
      </div>
    </div>

    <!-- Меню управления ставками -->
    <div class="controls" id="controls">
      <div class="input-group">
        <span class="input-label">Сумма ставки</span>
        <div class="bet-input-row">
          <input type="number" id="betInput" class="bet-input" value="10" min="1" inputmode="numeric">
        </div>
        <div class="quick-bets">
          <button class="quick-btn" data-val="min">Min</button>
          <button class="quick-btn" data-val="50">50</button>
          <button class="quick-btn" data-val="100">100</button>
          <button class="quick-btn" data-val="max">Max</button>
        </div>
      </div>

      <div class="input-group">
        <span class="input-label">Исход (Коэффициент 2X)</span>
        <div class="outcomes-grid">
          <button class="outcome-btn active" data-type="even">Чёт <span class="coef">2x</span></button>
          <button class="outcome-btn" data-type="odd">Нечёт <span class="coef">2x</span></button>
          <button class="outcome-btn" data-type="low">1–3 <span class="coef">2x</span></button>
          <button class="outcome-btn" data-type="high">4–6 <span class="coef">2x</span></button>
        </div>
      </div>

      <button class="submit-btn" id="playBtn">Сделать ставку</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');

    const initData = tg.initData || '';
    let currentBalance = 0;
    let selectedBetType = 'even';
    let isRolling = false;

    const cubeEl = document.getElementById('cube');
    const headerEl = document.getElementById('header');
    const controlsEl = document.getElementById('controls');
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('betInput');
    const playBtn = document.getElementById('playBtn');
    const bonusBtn = document.getElementById('bonusBtn');
    const resultBanner = document.getElementById('resultBanner');
    const videoOverlay = document.getElementById('videoOverlay');
    const rollVideo = document.getElementById('rollVideo');

    // Углы поворота куба для каждой выпавшей грани
    const faceRotations = {
      1: 'rotateX(0deg) rotateY(0deg)',
      6: 'rotateX(0deg) rotateY(180deg)',
      2: 'rotateX(0deg) rotateY(90deg)',
      5: 'rotateX(0deg) rotateY(-90deg)',
      3: 'rotateX(-90deg) rotateY(0deg)',
      4: 'rotateX(90deg) rotateY(0deg)'
    };

    // 1. Первые 5 секунд — вращение кубика, затем показ интерфейса
    setTimeout(() => {
      cubeEl.classList.remove('intro-spin');
      cubeEl.style.transform = faceRotations[1];
      cubeEl.classList.add('shrunk');
      headerEl.classList.add('visible');
      controlsEl.classList.add('visible');
      resultBanner.classList.add('visible');
    }, 5000);

    // 2. Авторизация и получение баланса с сервера
    async function authenticate() {
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData })
        });
        const data = await res.json();
        if (res.ok) {
          updateBalanceUI(data.balance);
        } else {
          showBanner(data.error || 'Ошибка авторизации Telegram', 'lose');
        }
      } catch (e) {
        showBanner('Ошибка соединения с сервером', 'lose');
      }
    }

    function updateBalanceUI(newBal) {
      currentBalance = newBal;
      balanceEl.textContent = currentBalance;
    }

    function showBanner(text, status = '') {
      resultBanner.textContent = text;
      resultBanner.className = 'result-banner visible ' + status;
    }

    // 3. Быстрые кнопки суммы ставки
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRolling) return;
        const val = btn.dataset.val;
        if (val === 'min') betInput.value = 1;
        else if (val === 'max') betInput.value = Math.max(1, currentBalance);
        else betInput.value = val;
      });
    });

    // 4. Выбор типа исхода
    document.querySelectorAll('.outcome-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRolling) return;
        document.querySelectorAll('.outcome-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedBetType = btn.dataset.type;
      });
    });

    // 5. Получение ежедневного бонуса
    bonusBtn.addEventListener('click', async () => {
      if (isRolling) return;
      try {
        const res = await fetch('/api/bonus', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData })
        });
        const data = await res.json();
        if (res.ok) {
          updateBalanceUI(data.balance);
          showBanner('Бонус +25 ₽ успешно начислен!', 'win');
        } else {
          showBanner(data.error, 'lose');
        }
      } catch (e) {
        showBanner('Ошибка запроса бонуса', 'lose');
      }
    });

    // 6. Отправка ставки и запуск 10-сек видео
    playBtn.addEventListener('click', async () => {
      if (isRolling) return;
      const amount = parseInt(betInput.value, 10);

      if (isNaN(amount) || amount <= 0) {
        return showBanner('Введите корректную сумму ставки', 'lose');
      }
      if (amount > currentBalance) {
        return showBanner('Недостаточно средств на балансе', 'lose');
      }

      isRolling = true;
      playBtn.disabled = true;
      showBanner('Прием ставки...');

      try {
        const res = await fetch('/api/roll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            amount,
            betType: selectedBetType
          })
        });

        const data = await res.json();
        if (!res.ok) {
          isRolling = false;
          playBtn.disabled = false;
          return showBanner(data.error || 'Ошибка ставки', 'lose');
        }

        // Списываем ставку визуально на время прокрутки видео
        updateBalanceUI(currentBalance - amount);
        playVideoAndReveal(data);

      } catch (e) {
        isRolling = false;
        playBtn.disabled = false;
        showBanner('Ошибка сети', 'lose');
      }
    });

    function playVideoAndReveal(rollResult) {
      videoOverlay.classList.add('active');
      rollVideo.currentTime = 0;

      let finished = false;
      const finishHandler = () => {
        if (finished) return;
        finished = true;
        videoOverlay.classList.remove('active');
        rollVideo.pause();
        revealDiceOutcome(rollResult);
      };

      rollVideo.onended = finishHandler;
      rollVideo.onerror = () => {
        // Если файла video.mp4 еще нет в папке, ждем 10 секунд
        setTimeout(finishHandler, 10000);
      };

      const playPromise = rollVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          setTimeout(finishHandler, 10000);
        });
      }
    }

    function revealDiceOutcome({ dice, won, payout, balance }) {
      cubeEl.classList.remove('reveal-pop');
      void cubeEl.offsetWidth; // Сброс рендера для перезапуска анимации

      // Эффектный поворот на выпавшее число
      cubeEl.style.transform = faceRotations[dice];
      cubeEl.classList.add('reveal-pop');

      updateBalanceUI(balance);

      if (won) {
        showBanner(`Выпало ${dice}! Победа +${payout} ₽`, 'win');
      } else {
        showBanner(`Выпало ${dice}. Вы проиграли`, 'lose');
      }

      isRolling = false;
      playBtn.disabled = false;
    }

    // Запуск авторизации при открытии
    authenticate();
  </script>
</body>
</html>
